name: Build

# 문서 · 훅 파일만 바뀐 push · PR 은 빌드하지 않는다(2026-10-18 재설계 세팅 — 공개 저장소라 분은 무료지만 macOS 러너 시간을 줄임). 손으로는 workflow_dispatch
on:
  push:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - ".codex/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - ".codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift test
      - run: ./Scripts/verify-no-kakao-assets.sh
      - run: ./Scripts/build-release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Dual-KakaoTalk-for-macOS
          path: |
            dist/Dual-KakaoTalk-for-macOS-v0.1.0-beta.21.zip
            dist/Dual-KakaoTalk-for-macOS-v0.1.0-beta.21.zip.manifest.json
          if-no-files-found: error
